<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentHub</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body>
  <!-- Skip link -->
  <a class="skip-link" href="#app">Skip to main content</a>

  <!-- Landing page — full-viewport, managed by pages/landing.js -->
  <div id="landing-root" hidden aria-hidden="true"></div>

  <!-- ============================================================
       App shell — top navigation + full-width content
  ============================================================ -->
  <div class="layout" id="layout">

    <!-- ── TOP NAVIGATION BAR ─────────────────────────────────── -->
    <header class="topnav" id="topnav" role="banner">
      <div class="topnav__inner">

        <!-- Brand -->
        <a class="topnav__brand" href="#dashboard" aria-label="StudentHub home">
          <span class="topnav__brand-icon" aria-hidden="true">🎓</span>
          <span class="topnav__brand-name">
            StudentHub
            <span class="topnav__brand-tagline">Manage. Track. Grow.</span>
          </span>
        </a>

        <!-- Desktop navigation links -->
        <nav class="topnav__nav" aria-label="Main navigation">
          <ul class="topnav__list" role="list">
            <li>
              <a class="nav-link" href="#dashboard" data-route="dashboard">
                <span class="nav-link__icon" aria-hidden="true">📊</span>
                <span class="nav-link__label">Dashboard</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#students" data-route="students">
                <span class="nav-link__icon" aria-hidden="true">👥</span>
                <span class="nav-link__label">Students</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#courses" data-route="courses">
                <span class="nav-link__icon" aria-hidden="true">📚</span>
                <span class="nav-link__label">Courses</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#marks" data-route="marks">
                <span class="nav-link__icon" aria-hidden="true">📝</span>
                <span class="nav-link__label">Marks</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#attendance" data-route="attendance">
                <span class="nav-link__icon" aria-hidden="true">📅</span>
                <span class="nav-link__label">Attendance</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Mobile hamburger -->
        <button
          class="topnav__hamburger"
          id="menu-btn"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span class="topnav__hamburger-bar"></span>
          <span class="topnav__hamburger-bar"></span>
          <span class="topnav__hamburger-bar"></span>
        </button>
      </div>

      <!-- Mobile dropdown menu -->
      <div class="topnav__mobile-menu" id="mobile-menu" hidden aria-label="Mobile navigation">
        <nav aria-label="Mobile site navigation">
          <ul class="topnav__mobile-list" role="list">
            <li>
              <a class="nav-link" href="#dashboard" data-route="dashboard">
                <span class="nav-link__icon" aria-hidden="true">📊</span>
                <span class="nav-link__label">Dashboard</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#students" data-route="students">
                <span class="nav-link__icon" aria-hidden="true">👥</span>
                <span class="nav-link__label">Students</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#courses" data-route="courses">
                <span class="nav-link__icon" aria-hidden="true">📚</span>
                <span class="nav-link__label">Courses</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#marks" data-route="marks">
                <span class="nav-link__icon" aria-hidden="true">📝</span>
                <span class="nav-link__label">Marks</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#attendance" data-route="attendance">
                <span class="nav-link__icon" aria-hidden="true">📅</span>
                <span class="nav-link__label">Attendance</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ── PAGE CONTENT ──────────────────────────────────────── -->
    <main id="app" class="content" tabindex="-1" aria-live="polite">
      <!-- JavaScript renders page content here -->
    </main>

  </div><!-- /.layout -->

  <script type="module" src="/js/app.js"></script>
</body>
</html>
